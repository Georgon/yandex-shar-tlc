services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: nyc-clickhouse

    ports:
      - "8123:8123"
      - "9000:9000"

    environment:
      CLICKHOUSE_DB: nyc
      CLICKHOUSE_USER: analyst
      CLICKHOUSE_PASSWORD: analyst
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"

    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./data:/var/lib/clickhouse/user_files/data:ro

    ulimits:
      nofile:
        soft: 262144
        hard: 262144

    restart: unless-stopped

volumes:
  clickhouse_data: